services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lensplan
      POSTGRES_PASSWORD: lensplan
      POSTGRES_DB: lensplan
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensplan"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: postgresql+psycopg://lensplan:lensplan@db:5432/lensplan
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8006"

  frontend:
    build: ./frontend
    ports:
      - "3006:80"
    depends_on:
      - api

volumes:
  pgdata:
